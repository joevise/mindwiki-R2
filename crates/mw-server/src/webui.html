<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mind Wiki</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fff; color: #111; min-height: 100vh;
  }
  .accent { color: #d92027; }
  header {
    border-bottom: 3px solid #d92027; padding: 14px 32px;
    display: flex; align-items: baseline; gap: 16px;
  }
  header h1 { font-size: 24px; letter-spacing: 1px; }
  header .tag { font-size: 12px; color: #666; }
  header .spacer { flex: 1; }
  main { max-width: 1400px; margin: 0 auto; padding: 18px 32px 32px; }
  .statusbar {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid #ddd; border-left: 6px solid #d92027;
    padding: 10px 16px; margin-bottom: 16px; font-size: 14px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #999; }
  .dot.open { background: #d92027; }
  .card {
    border: 1px solid #ddd; padding: 14px; margin-bottom: 14px;
  }
  .card h2 { font-size: 14px; margin-bottom: 10px; }
  .card h2::before { content: "■ "; color: #d92027; font-size: 10px; vertical-align: 2px; }
  input[type=password], input[type=text], input[type=file], select {
    width: 100%; padding: 8px; border: 1px solid #bbb; font-size: 13px;
    margin-bottom: 8px; background: #fff; color: #111;
  }
  input:focus, select:focus { outline: 2px solid #d92027; outline-offset: -1px; }
  button {
    background: #111; color: #fff; border: none; padding: 8px 18px;
    font-size: 13px; cursor: pointer;
  }
  button:hover { background: #d92027; }
  button:disabled { background: #999; cursor: not-allowed; }
  button.ghost { background: #fff; color: #111; border: 1px solid #bbb; }
  button.ghost:hover { color: #d92027; border-color: #d92027; }
  button.lock {
    background: #d92027; font-weight: bold; width: 100%;
    padding: 12px; font-size: 15px; letter-spacing: 2px;
  }
  button.lock:hover { background: #a8151b; }
  .msg { font-size: 12px; margin-top: 6px; min-height: 16px; }
  .msg.error { color: #d92027; }
  .msg.ok { color: #111; }
  .hidden { display: none !important; }
  .files { font-size: 12px; color: #666; margin-top: 8px; }
  .files a { color: #3B82F6; cursor: pointer; text-decoration: none; display: block; line-height: 1.8; }
  .files a:hover { text-decoration: underline; }

  /* 主布局：侧栏 + 聊天 */
  .layout { display: flex; gap: 16px; align-items: flex-start; }
  #sidebar { width: 360px; min-width: 360px; }
  #chat { flex: 1; min-width: 0; }

  /* 聊天 */
  #chat-list {
    border: 1px solid #ddd; padding: 16px; min-height: 420px; max-height: 62vh;
    overflow-y: auto; background: #fafafa;
  }
  .bubble-row { display: flex; margin-bottom: 12px; }
  .bubble-row.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 10px 14px; font-size: 14px; line-height: 1.7;
    border: 1px solid #ddd; background: #fff; word-wrap: break-word;
  }
  .bubble-row.user .bubble {
    background: #111; color: #fff; border-color: #111; white-space: pre-wrap;
  }
  .bubble .status { font-size: 12px; color: #999; margin-bottom: 6px; line-height: 1.6; }
  .bubble .status div::before { content: "⚙ "; color: #d92027; }
  .bubble .err { color: #d92027; font-size: 13px; }
  .chat-input { display: flex; gap: 8px; margin-top: 10px; }
  .chat-input input { flex: 1; margin-bottom: 0; }
  .chat-input button { white-space: nowrap; }

  /* markdown 渲染（聊天气泡 + 预览共用） */
  .md h1, .md h2, .md h3, .md h4 { margin: 12px 0 6px; }
  .md h1 { font-size: 20px; border-bottom: 2px solid #d92027; padding-bottom: 5px; }
  .md h2 { font-size: 17px; }
  .md h3 { font-size: 15px; }
  .md p { margin: 6px 0; }
  .md ul { padding-left: 20px; margin: 6px 0; }
  .md blockquote {
    border-left: 3px solid #d92027; padding: 3px 10px; margin: 6px 0;
    color: #555; background: #fafafa;
  }
  .md code { background: #f2f2f2; padding: 1px 5px; font-size: 13px; }
  .md pre { background: #f7f7f7; border: 1px solid #e5e5e5; padding: 10px; overflow: auto; margin: 6px 0; }
  .md pre code { background: none; padding: 0; }
  .md a.wl { color: #3B82F6; text-decoration: none; border-bottom: 1px dashed #3B82F6; cursor: pointer; }

  /* 入库进度 */
  #ingest-progress {
    font-size: 12px; color: #999; max-height: 140px; overflow-y: auto;
    margin-top: 8px; line-height: 1.7;
  }
  #ingest-progress div::before { content: "⚙ "; color: #d92027; }
  #ingest-progress div.err { color: #d92027; }
  #ingest-progress div.err::before { content: "✕ "; }

  /* 文件树 / 图谱 */
  .tabs { display: flex; gap: 0; border-bottom: 2px solid #111; }
  .tabs button {
    background: #fff; color: #111; border: 1px solid #ddd; border-bottom: none;
    padding: 6px 14px; font-size: 13px; margin-right: 4px;
  }
  .tabs button.active { background: #111; color: #fff; }
  .browser {
    border: 1px solid #ddd; border-top: none; min-height: 300px;
    max-height: 380px; overflow: auto; padding: 10px; position: relative;
  }
  .tree ul { list-style: none; padding-left: 14px; }
  .tree > ul { padding-left: 0; }
  .tree li { font-size: 12px; line-height: 1.9; }
  .tree .dir > .row { cursor: pointer; font-weight: 600; }
  .tree .dir > .row::before { content: "▾ "; color: #d92027; }
  .tree .dir.closed > .row::before { content: "▸ "; color: #d92027; }
  .tree .dir.closed > ul { display: none; }
  .tree .file > .row { cursor: pointer; }
  .tree .file > .row::before { content: "· "; color: #999; }
  .tree .row:hover { color: #d92027; }
  #graph-canvas { display: block; cursor: grab; }

  /* 预览弹层 */
  #preview {
    position: fixed; inset: 0; background: rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center; z-index: 20;
  }
  #preview-box {
    background: #fff; width: min(860px, 92vw); max-height: 84vh; overflow-y: auto;
    border-top: 4px solid #d92027; padding: 22px 28px; font-size: 14px; line-height: 1.8;
    position: relative;
  }
  #preview-close {
    position: absolute; top: 10px; right: 12px; background: #fff; color: #111;
    border: 1px solid #bbb; padding: 4px 12px;
  }
  #preview-path { font-size: 12px; color: #999; margin-bottom: 10px; }
</style>
</head>
<body>
<header>
  <h1>Mind <span class="accent">Wiki</span></h1>
  <span class="tag">企业级安全 AI 知识库</span>
  <span class="spacer"></span>
  <button class="ghost hidden" id="btn-collapse" onclick="toggleSidebar()">☰ 侧栏</button>
</header>
<main>
  <div class="statusbar">
    <span class="dot" id="dot"></span>
    <span id="status-text">加载中…</span>
  </div>

  <div class="card hidden" id="card-init">
    <h2>创建知识库</h2>
    <input type="password" id="init-password" placeholder="设置主密码">
    <button onclick="doInit()">创建知识库</button>
    <div class="msg" id="init-msg"></div>
  </div>

  <div class="card hidden" id="card-unlock">
    <h2>解锁知识库</h2>
    <input type="password" id="open-password" placeholder="主密码"
           onkeydown="if(event.key==='Enter')doOpen()">
    <button onclick="doOpen()">解锁</button>
    <div class="msg" id="open-msg"></div>
  </div>

  <div id="section-open" class="hidden">
    <div class="layout">
      <aside id="sidebar">
        <div class="card">
          <h2>上传 Markdown 入库</h2>
          <input type="file" id="ingest-file" accept=".md">
          <button id="btn-ingest" onclick="doIngest()">入库</button>
          <div class="msg" id="ingest-msg"></div>
          <div id="ingest-progress"></div>
          <div class="files" id="ingest-files"></div>
        </div>

        <div class="card">
          <h2>Wiki 浏览</h2>
          <div class="tabs">
            <button id="tab-tree" class="active" onclick="switchTab('tree')">文件树</button>
            <button id="tab-graph" onclick="switchTab('graph')">图谱</button>
          </div>
          <div class="browser">
            <div id="tree-view" class="tree"></div>
            <div id="graph-wrap" class="hidden">
              <canvas id="graph-canvas"></canvas>
            </div>
          </div>
        </div>

        <div class="card">
          <h2>模型设置 ⚙️</h2>
          <select id="llm-provider">
            <option value="openai_compat">openai_compat</option>
            <option value="anthropic">anthropic</option>
          </select>
          <button class="ghost" onclick="presetOpenRouter()">OpenRouter 预设</button>
          <div style="height:8px"></div>
          <input type="text" id="llm-base-url" placeholder="base_url，如 https://openrouter.ai/api/v1">
          <input type="password" id="llm-api-key" placeholder="api_key">
          <input type="text" id="llm-model" placeholder="model，如 deepseek/deepseek-v4-flash">
          <button onclick="saveSettings()">保存</button>
          <div class="msg" id="llm-msg"></div>
        </div>

        <button class="lock" onclick="doLock()">🔒 一键锁定</button>
        <div class="msg" id="lock-msg"></div>
      </aside>

      <section id="chat">
        <div id="chat-list"></div>
        <div class="chat-input">
          <input type="text" id="chat-input" placeholder="向知识库提问…"
                 onkeydown="if(event.key==='Enter')sendChat()">
          <button id="btn-send" onclick="sendChat()">发送</button>
          <button class="ghost" onclick="newChat()">新对话</button>
        </div>
      </section>
    </div>
  </div>
</main>

<div id="preview" class="hidden" onclick="if(event.target===this)closePreview()">
  <div id="preview-box">
    <button id="preview-close" onclick="closePreview()">关闭 ✕</button>
    <div id="preview-path"></div>
    <div id="preview-content" class="md"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

function showMsg(id, text, isError) {
  const el = $(id);
  el.textContent = text || "";
  el.className = "msg " + (isError ? "error" : "ok");
}

function friendly(status, body) {
  if (status === 423) return "知识库已锁定，请先解锁";
  if (status === 503) return (body && body.error) || "未配置 LLM：请在设置页填写模型配置";
  return (body && body.error) || ("请求失败：HTTP " + status);
}

let wasOpen = false;

async function refresh() {
  try {
    const st = await (await fetch("/api/vault/status")).json();
    const gw = await (await fetch("/api/gateway/state")).json();
    const open = st.exists && gw.state === "open";
    $("dot").className = "dot" + (open ? " open" : "");
    $("status-text").textContent = !st.exists
      ? "未初始化 — 请创建知识库"
      : open ? "已解锁 🔓（明文仅在内存临时区）" : "密封 🔒（磁盘上为密文）";
    $("card-init").classList.toggle("hidden", st.exists);
    $("card-unlock").classList.toggle("hidden", !st.exists || open);
    $("section-open").classList.toggle("hidden", !open);
    $("btn-collapse").classList.toggle("hidden", !open);
    if (open && !wasOpen) onUnlocked();
    if (!open && wasOpen) onLocked();
    wasOpen = open;
  } catch (e) {
    $("status-text").textContent = "服务连接失败";
  }
}

function onUnlocked() { loadTree(); graphDirty = true; loadSettings(); }
function onLocked() {
  $("tree-view").innerHTML = "";
  $("chat-list").innerHTML = "";
  $("ingest-progress").innerHTML = "";
  $("ingest-files").innerHTML = "";
  closePreview();
  G.nodes = []; G.edges = []; G.raw = null; graphDirty = true;
  cancelAnimationFrame(G.raf);
  const ctx = $("graph-canvas").getContext("2d");
  ctx && ctx.clearRect(0, 0, 9999, 9999);
}

function toggleSidebar() {
  $("sidebar").classList.toggle("hidden");
}

async function doInit() {
  const password = $("init-password").value;
  if (!password) return showMsg("init-msg", "请输入主密码", true);
  const resp = await fetch("/api/vault/init", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({password})
  });
  const body = await resp.json().catch(() => null);
  if (resp.ok) {
    showMsg("init-msg", "创建成功，请解锁", false);
    refresh();
  } else {
    showMsg("init-msg", friendly(resp.status, body), true);
  }
}

async function doOpen() {
  const password = $("open-password").value;
  const resp = await fetch("/api/gateway/open", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({password})
  });
  const body = await resp.json().catch(() => null);
  if (resp.ok) {
    $("open-password").value = "";
    showMsg("open-msg", "", false);
    refresh();
  } else {
    showMsg("open-msg", resp.status === 403 ? "密码错误" : friendly(resp.status, body), true);
  }
}

async function doLock() {
  let token = sessionStorage.getItem("mw_admin_token");
  if (!token) {
    token = prompt("输入 admin token（见 vault 目录下 admin.token 文件）");
    if (!token) return;
  }
  const resp = await fetch("/api/gateway/close", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({admin_token: token})
  });
  if (resp.ok) {
    sessionStorage.setItem("mw_admin_token", token);
    showMsg("lock-msg", "已锁定：密钥已销毁，会话已终止", false);
    refresh();
  } else {
    sessionStorage.removeItem("mw_admin_token");
    showMsg("lock-msg", "admin token 无效", true);
  }
}

/* ============ SSE 读取（fetch POST + ReadableStream 手动解析 data: 行） ============ */
async function readSSE(resp, onEvent) {
  const ct = resp.headers.get("content-type") || "";
  if (!resp.ok || !ct.includes("text/event-stream")) {
    const body = await resp.json().catch(() => null);
    onEvent({type: "error", error: friendly(resp.status, body)});
    return;
  }
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const chunk = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      for (const line of chunk.split("\n")) {
        if (line.startsWith("data: ")) {
          try { onEvent(JSON.parse(line.slice(6))); } catch (e) {}
        }
      }
    }
  }
}

/* ============ 聊天 ============ */
let chatBusy = false;

function setChatBusy(on) {
  chatBusy = on;
  $("btn-send").disabled = on;
  $("chat-input").disabled = on;
}

function addBubble(role) {
  const row = document.createElement("div");
  row.className = "bubble-row " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble md";
  row.appendChild(bubble);
  $("chat-list").appendChild(row);
  $("chat-list").scrollTop = $("chat-list").scrollHeight;
  return bubble;
}

function bindWikilinks(el) {
  el.querySelectorAll("a.wl").forEach(a => {
    a.onclick = e => { e.preventDefault(); openByStem(a.dataset.target); };
  });
}

async function sendChat() {
  const input = $("chat-input");
  const message = input.value.trim();
  if (!message || chatBusy) return;
  input.value = "";
  addBubble("user").textContent = message;
  const bubble = addBubble("agent");
  const status = document.createElement("div");
  status.className = "status";
  bubble.appendChild(status);
  const content = document.createElement("div");
  bubble.appendChild(content);
  const recent = [];
  let text = "";
  let finished = false;

  setChatBusy(true);
  try {
    const resp = await fetch("/api/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message})
    });
    await readSSE(resp, ev => {
      if (ev.type === "tool_call") {
        recent.push((ev.name || "tool") + " " + (ev.detail || ""));
        status.innerHTML = recent.slice(-3).map(escHtml).map(s => `<div>${s}</div>`).join("");
      } else if (ev.type === "message") {
        text += ev.text || "";
        content.innerHTML = renderMd(text);
        bindWikilinks(content);
      } else if (ev.type === "done") {
        finished = true;
        if (!text && ev.answer) {
          content.innerHTML = renderMd(ev.answer);
          bindWikilinks(content);
        }
      } else if (ev.type === "error") {
        finished = true;
        const d = document.createElement("div");
        d.className = "err";
        d.textContent = ev.error || "未知错误";
        bubble.appendChild(d);
      }
      $("chat-list").scrollTop = $("chat-list").scrollHeight;
    });
  } catch (e) {
    const d = document.createElement("div");
    d.className = "err";
    d.textContent = "网络错误：" + e;
    bubble.appendChild(d);
  } finally {
    status.remove();
    if (!finished && !text) {
      const d = document.createElement("div");
      d.className = "err";
      d.textContent = "连接中断";
      bubble.appendChild(d);
    }
    setChatBusy(false);
    input.focus();
  }
}

async function newChat() {
  await fetch("/api/chat/reset", {method: "POST"});
  $("chat-list").innerHTML = "";
}

/* ============ 流式入库 ============ */
async function doIngest() {
  const file = $("ingest-file").files[0];
  if (!file) return showMsg("ingest-msg", "请选择 .md 文件", true);
  const fd = new FormData();
  fd.append("file", file);
  $("btn-ingest").disabled = true;
  $("ingest-progress").innerHTML = "";
  $("ingest-files").innerHTML = "";
  showMsg("ingest-msg", "入库中…", false);
  const prog = $("ingest-progress");
  const addLine = (t, isErr) => {
    const d = document.createElement("div");
    if (isErr) d.className = "err";
    d.textContent = t;
    prog.appendChild(d);
    prog.scrollTop = prog.scrollHeight;
  };
  try {
    const resp = await fetch("/api/ingest/stream", {method: "POST", body: fd});
    let ok = false;
    await readSSE(resp, ev => {
      if (ev.type === "tool_call") {
        addLine((ev.name || "tool") + " " + (ev.detail || ""));
      } else if (ev.type === "done") {
        ok = true;
        showMsg("ingest-msg", "入库完成", false);
        const files = ev.files || [];
        if (files.length) {
          $("ingest-files").innerHTML = "变更文件（点击预览）：";
          for (const f of files) {
            const a = document.createElement("a");
            a.textContent = f;
            a.onclick = () => openPage(f);
            $("ingest-files").appendChild(a);
          }
        }
      } else if (ev.type === "error") {
        addLine(ev.error || "未知错误", true);
        showMsg("ingest-msg", ev.error || "入库失败", true);
      }
    });
    if (!ok && !$("ingest-msg").classList.contains("error")) {
      showMsg("ingest-msg", "连接中断", true);
    }
  } catch (e) {
    showMsg("ingest-msg", "网络错误：" + e, true);
  } finally {
    $("btn-ingest").disabled = false;
    $("ingest-file").value = "";
    loadTree(); graphDirty = true;
  }
}

/* ============ 模型设置 ============ */
async function loadSettings() {
  const resp = await fetch("/api/llm/config");
  if (!resp.ok) return;
  const body = await resp.json().catch(() => null);
  if (!body) return;
  $("llm-provider").value = body.provider || "openai_compat";
  $("llm-base-url").value = body.base_url || "";
  $("llm-model").value = body.model || "";
  $("llm-api-key").placeholder = body.api_key_masked
    ? "当前 key：" + body.api_key_masked + "（重新输入以修改）"
    : "api_key";
}

function presetOpenRouter() {
  $("llm-provider").value = "openai_compat";
  $("llm-base-url").value = "https://openrouter.ai/api/v1";
}

async function saveSettings() {
  const payload = {
    provider: $("llm-provider").value,
    base_url: $("llm-base-url").value.trim(),
    api_key: $("llm-api-key").value.trim(),
    model: $("llm-model").value.trim()
  };
  if (!payload.base_url || !payload.api_key || !payload.model) {
    return showMsg("llm-msg", "base_url / api_key / model 均不能为空", true);
  }
  const resp = await fetch("/api/llm/config", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  });
  const body = await resp.json().catch(() => null);
  if (resp.ok) {
    showMsg("llm-msg", "已生效（聊天会话将用新模型重建）", false);
    $("llm-api-key").value = "";
    loadSettings();
  } else {
    showMsg("llm-msg", friendly(resp.status, body), true);
  }
}

/* ============ 标签页 ============ */
let graphDirty = true;
function switchTab(tab) {
  $("tab-tree").classList.toggle("active", tab === "tree");
  $("tab-graph").classList.toggle("active", tab === "graph");
  $("tree-view").classList.toggle("hidden", tab !== "tree");
  $("graph-wrap").classList.toggle("hidden", tab !== "graph");
  if (tab === "graph") loadGraph();
}

/* ============ 文件树 ============ */
async function loadTree() {
  const resp = await fetch("/api/wiki/tree");
  if (!resp.ok) return;
  const tree = await resp.json();
  $("tree-view").innerHTML = "";
  $("tree-view").appendChild(renderTreeNode(tree));
}

function renderTreeNode(node) {
  const ul = document.createElement("ul");
  for (const child of (node.children || [])) {
    const li = document.createElement("li");
    li.className = child.type;
    const row = document.createElement("div");
    row.className = "row";
    row.textContent = child.name;
    li.appendChild(row);
    if (child.type === "dir") {
      row.onclick = () => li.classList.toggle("closed");
      li.appendChild(renderTreeNode(child));
    } else {
      row.onclick = () => openPage(child.path);
    }
    ul.appendChild(li);
  }
  return ul;
}

/* ============ 轻量 Markdown 渲染器 ============ */
function escHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function inlineMd(s) {
  s = escHtml(s);
  s = s.replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]*))?\]\]/g,
    (m, t, label) => `<a class="wl" data-target="${t.trim()}">${label || t.trim()}</a>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  return s;
}
function renderMd(src) {
  const lines = src.split("\n");
  let html = "", inCode = false, inList = false, inFm = false, first = true;
  const closeList = () => { if (inList) { html += "</ul>"; inList = false; } };
  for (const line of lines) {
    const t = line.trim();
    if (first && t === "---") { inFm = true; first = false; continue; }
    first = false;
    if (inFm) { if (t === "---") inFm = false; continue; }
    if (t.startsWith("```")) {
      closeList();
      html += inCode ? "</code></pre>" : "<pre><code>";
      inCode = !inCode; continue;
    }
    if (inCode) { html += escHtml(line) + "\n"; continue; }
    let m;
    if ((m = t.match(/^(#{1,4})\s+(.*)/))) {
      closeList();
      html += `<h${m[1].length}>${inlineMd(m[2])}</h${m[1].length}>`;
    } else if ((m = t.match(/^[-*]\s+(.*)/))) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${inlineMd(m[1])}</li>`;
    } else if ((m = t.match(/^&gt;\s?(.*)/)) || (m = t.match(/^>\s?(.*)/))) {
      closeList();
      html += `<blockquote>${inlineMd(m[1])}</blockquote>`;
    } else if (t === "") {
      closeList();
    } else {
      closeList();
      html += `<p>${inlineMd(line)}</p>`;
    }
  }
  closeList();
  if (inCode) html += "</code></pre>";
  return html;
}

/* ============ 页面预览（弹层） ============ */
async function openPage(path) {
  const resp = await fetch("/api/wiki/page?path=" + encodeURIComponent(path));
  const body = await resp.json().catch(() => null);
  $("preview").classList.remove("hidden");
  $("preview-path").textContent = path;
  if (!resp.ok) {
    $("preview-content").textContent = friendly(resp.status, body);
    return;
  }
  $("preview-content").innerHTML = renderMd(body.content || "");
  bindWikilinks($("preview-content"));
}

function closePreview() {
  $("preview").classList.add("hidden");
}

async function openByStem(stem) {
  if (!G.raw) {
    const resp = await fetch("/api/wiki/graph");
    if (resp.ok) G.raw = await resp.json();
  }
  const node = (G.raw && G.raw.nodes || []).find(n => n.label === stem);
  if (node) openPage(node.id);
}

/* ============ 图谱（canvas 力导向） ============ */
const TYPE_COLORS = {
  "index": "#1B1D22", "concept": "#F5453D", "algorithm": "#E0941F",
  "paper": "#3B82F6", "experiment": "#0E9C8E", "source-record": "#9AA0AA",
  "page": "#6B7280"
};
const G = {
  nodes: [], edges: [], raw: null,
  k: 1, tx: 0, ty: 0, hover: null, drag: null, pan: null,
  frame: 0, raf: 0, moved: false
};

async function loadGraph() {
  if (!graphDirty && G.raw) { drawGraph(); return; }
  const resp = await fetch("/api/wiki/graph");
  if (!resp.ok) return;
  G.raw = await resp.json();
  graphDirty = false;
  const canvas = $("graph-canvas");
  const w = $("sidebar").clientWidth - 50, h = 340;
  canvas.width = w; canvas.height = h;
  canvas.style.width = w + "px"; canvas.style.height = h + "px";
  const deg = {};
  for (const e of G.raw.edges) {
    deg[e.from] = (deg[e.from] || 0) + 1;
    deg[e.to] = (deg[e.to] || 0) + 1;
  }
  G.nodes = G.raw.nodes.map((n, i) => ({
    id: n.id, label: n.label, type: n.type,
    r: 6 + (deg[n.id] || 0) * 2,
    x: Math.cos(i * 2.399) * (50 + i * 10), y: Math.sin(i * 2.399) * (50 + i * 10),
    vx: 0, vy: 0, fixed: false
  }));
  const idx = {};
  G.nodes.forEach((n, i) => idx[n.id] = i);
  G.edges = G.raw.edges
    .filter(e => idx[e.from] !== undefined && idx[e.to] !== undefined)
    .map(e => [idx[e.from], idx[e.to]]);
  G.k = 1; G.tx = w / 2; G.ty = h / 2; G.frame = 0;
  cancelAnimationFrame(G.raf);
  tick();
}

function tick() {
  const ns = G.nodes, cx = 0, cy = 0;
  for (let i = 0; i < ns.length; i++) {
    const a = ns[i];
    let fx = (cx - a.x) * 0.002, fy = (cy - a.y) * 0.002;
    for (let j = 0; j < ns.length; j++) {
      if (i === j) continue;
      const b = ns[j];
      let dx = a.x - b.x, dy = a.y - b.y;
      let d2 = dx * dx + dy * dy || 1;
      const f = 3000 / d2;
      fx += dx * f / Math.sqrt(d2); fy += dy * f / Math.sqrt(d2);
    }
    a.fx = fx; a.fy = fy;
  }
  for (const [i, j] of G.edges) {
    const a = ns[i], b = ns[j];
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const f = (d - 110) * 0.01;
    a.fx += dx / d * f; a.fy += dy / d * f;
    b.fx -= dx / d * f; b.fy -= dy / d * f;
  }
  for (const n of ns) {
    if (n.fixed) continue;
    n.vx = (n.vx + n.fx) * 0.6; n.vy = (n.vy + n.fy) * 0.6;
    n.x += n.vx; n.y += n.vy;
  }
  drawGraph();
  if (++G.frame < 300) G.raf = requestAnimationFrame(tick);
}

function drawGraph() {
  const canvas = $("graph-canvas");
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(G.k, 0, 0, G.k, G.tx, G.ty);
  const adj = new Set();
  if (G.hover !== null) {
    adj.add(G.hover);
    for (const [i, j] of G.edges) {
      if (i === G.hover) adj.add(j);
      if (j === G.hover) adj.add(i);
    }
  }
  const dim = G.hover !== null;
  ctx.lineWidth = 1 / G.k;
  for (const [i, j] of G.edges) {
    const hot = dim && adj.has(i) && adj.has(j) && (i === G.hover || j === G.hover);
    ctx.strokeStyle = dim ? (hot ? "#F5453D" : "rgba(150,150,150,0.12)") : "#c9cdd4";
    ctx.beginPath();
    ctx.moveTo(G.nodes[i].x, G.nodes[i].y);
    ctx.lineTo(G.nodes[j].x, G.nodes[j].y);
    ctx.stroke();
  }
  G.nodes.forEach((n, i) => {
    const alpha = dim && !adj.has(i) ? 0.15 : 1;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = TYPE_COLORS[n.type] || TYPE_COLORS.page;
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    ctx.fill();
    if (i === G.hover) {
      ctx.strokeStyle = "#1B1D22"; ctx.lineWidth = 2 / G.k;
      ctx.stroke();
    }
    ctx.fillStyle = "#1B1D22";
    ctx.font = `${11 / G.k}px sans-serif`;
    ctx.textAlign = "center";
    ctx.fillText(n.label, n.x, n.y + n.r + 12 / G.k);
    ctx.globalAlpha = 1;
  });
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

function graphPos(e) {
  const rect = $("graph-canvas").getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  return { mx, my, wx: (mx - G.tx) / G.k, wy: (my - G.ty) / G.k };
}
function nodeAt(wx, wy) {
  for (let i = G.nodes.length - 1; i >= 0; i--) {
    const n = G.nodes[i];
    const dx = wx - n.x, dy = wy - n.y;
    if (dx * dx + dy * dy <= (n.r + 3) * (n.r + 3)) return i;
  }
  return null;
}

(function initGraphEvents() {
  const canvas = $("graph-canvas");
  canvas.addEventListener("mousedown", e => {
    const p = graphPos(e);
    const i = nodeAt(p.wx, p.wy);
    G.moved = false;
    if (i !== null) { G.drag = i; G.nodes[i].fixed = true; }
    else G.pan = { x: p.mx, y: p.my, tx: G.tx, ty: G.ty };
  });
  canvas.addEventListener("mousemove", e => {
    const p = graphPos(e);
    if (G.drag !== null) {
      G.nodes[G.drag].x = p.wx; G.nodes[G.drag].y = p.wy;
      G.moved = true; drawGraph(); return;
    }
    if (G.pan) {
      G.tx = G.pan.tx + p.mx - G.pan.x; G.ty = G.pan.ty + p.my - G.pan.y;
      G.moved = true; drawGraph(); return;
    }
    const i = nodeAt(p.wx, p.wy);
    if (i !== G.hover) { G.hover = i; drawGraph(); }
    canvas.style.cursor = i !== null ? "pointer" : "grab";
  });
  canvas.addEventListener("mouseup", e => {
    if (G.drag !== null && !G.moved) openPage(G.nodes[G.drag].id);
    G.drag = null; G.pan = null;
  });
  canvas.addEventListener("mouseleave", () => {
    G.drag = null; G.pan = null; G.hover = null; drawGraph();
  });
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    const p = graphPos(e);
    const k2 = Math.min(4, Math.max(0.2, G.k * (e.deltaY < 0 ? 1.12 : 0.89)));
    G.tx = p.mx - (p.mx - G.tx) * (k2 / G.k);
    G.ty = p.my - (p.my - G.ty) * (k2 / G.k);
    G.k = k2; drawGraph();
  }, {passive: false});
})();

refresh();
setInterval(refresh, 3000);
</script>
