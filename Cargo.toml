[workspace]
resolver = "2"
members = [
    "crates/mw-store",
    "crates/mw-crypto",
    "crates/mw-wiki",
    "crates/mw-agent",
    "crates/mw-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["joevise"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }
git2 = "0.19"
tempfile = "3"
rand = "0.8"
argon2 = "0.5"
aes-gcm = "0.10"
reqwest = { version = "0.12", features = ["json", "stream"] }
async-trait = "0.1"

# 内部依赖（git 依赖，锁定 tag，clone 即 build）
r2-core = { git = "https://github.com/joevise/r2-agent.git" }
besure = { git = "https://github.com/joevise/besureAI.git", package = "besure" }

# 内部 crate 互引
mw-store = { path = "crates/mw-store" }
mw-crypto = { path = "crates/mw-crypto" }
mw-wiki = { path = "crates/mw-wiki" }
mw-agent = { path = "crates/mw-agent" }

[profile.release]
lto = true
strip = true
